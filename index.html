<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Uygulaması</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tabs button {
      flex: 1; padding: 9px; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 11px 12px; border-radius: 9px;
      border: 1px solid var(--border); background: #0f172a; color: var(--text);
      font-size: 14px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 11px; margin-top: 18px; border: none;
      background: var(--accent); color: #fff; border-radius: 9px;
      font-size: 15px; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
    .msg.error { display: block; background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .msg.success { display: block; background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.3); }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .topbar .email { font-size: 13px; color: var(--muted); }
    .logout { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .logout:hover { color: var(--text); border-color: var(--muted); }
    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; }
    .add-row button { width: auto; padding: 0 18px; margin: 0; border: none; background: var(--accent); color: #fff; border-radius: 9px; cursor: pointer; font-size: 20px; }
    .add-row button:hover { background: var(--accent-hover); }
    ul { list-style: none; margin-top: 18px; }
    li { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--green); }
    li .task { flex: 1; font-size: 15px; }
    li .task.done { text-decoration: line-through; color: var(--muted); }
    li .del { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 2px 6px; }
    li .del:hover { color: var(--danger); }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- AUTH GÖRÜNÜMÜ -->
  <div class="container" id="authView">
    <h1>Todo Uygulaması</h1>
    <p class="sub">Devam etmek için giriş yap veya kayıt ol</p>
    <div class="tabs">
      <button id="tabLogin" class="active">Giriş Yap</button>
      <button id="tabSignup">Kayıt Ol</button>
    </div>
    <form id="authForm">
      <label for="email">E-posta</label>
      <input type="email" id="email" required autocomplete="email" placeholder="ornek@eposta.com" />
      <label for="password">Şifre</label>
      <input type="password" id="password" required minlength="6" autocomplete="current-password" placeholder="En az 6 karakter" />
      <button type="submit" class="btn" id="authBtn">Giriş Yap</button>
    </form>
    <div class="msg" id="authMsg"></div>
  </div>

  <!-- TODO GÖRÜNÜMÜ -->
  <div class="container hidden" id="appView">
    <div class="topbar">
      <div>
        <h1>Yapılacaklar</h1>
        <span class="email" id="userEmail"></span>
      </div>
      <button class="logout" id="logoutBtn">Çıkış</button>
    </div>
    <form class="add-row" id="addForm">
      <input type="text" id="newTask" placeholder="Yeni görev ekle..." required />
      <button type="submit" title="Ekle">+</button>
    </form>
    <ul id="todoList"></ul>
    <div class="empty hidden" id="emptyState">Henüz görev yok. İlkini ekle! 🎉</div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://knobvfyrxpitogkfidod.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tSFehwlz56Wq0LHVxq0ptQ_TjDeOpK9";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Elementler
    const authView = document.getElementById("authView");
    const appView = document.getElementById("appView");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const authForm = document.getElementById("authForm");
    const authBtn = document.getElementById("authBtn");
    const authMsg = document.getElementById("authMsg");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const userEmail = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const addForm = document.getElementById("addForm");
    const newTask = document.getElementById("newTask");
    const todoList = document.getElementById("todoList");
    const emptyState = document.getElementById("emptyState");

    let mode = "login"; // "login" | "signup"

    function showMsg(text, type) {
      authMsg.textContent = text;
      authMsg.className = "msg " + type;
    }
    function clearMsg() { authMsg.className = "msg"; }

    // Sekme değiştirme
    tabLogin.onclick = () => setMode("login");
    tabSignup.onclick = () => setMode("signup");
    function setMode(m) {
      mode = m;
      clearMsg();
      tabLogin.classList.toggle("active", m === "login");
      tabSignup.classList.toggle("active", m === "signup");
      authBtn.textContent = m === "login" ? "Giriş Yap" : "Kayıt Ol";
      passwordInput.autocomplete = m === "login" ? "current-password" : "new-password";
    }

    // Giriş / Kayıt
    authForm.onsubmit = async (e) => {
      e.preventDefault();
      clearMsg();
      authBtn.disabled = true;
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        if (mode === "signup") {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;
          // E-posta onayı kapalı olduğu için kullanıcı direkt oturum açar
          if (data.session) {
            // onAuthStateChange devralacak
          } else {
            showMsg("Kayıt başarılı! Giriş yapılıyor...", "success");
            const { error: signErr } = await supabase.auth.signInWithPassword({ email, password });
            if (signErr) throw signErr;
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
      } catch (err) {
        showMsg(translateError(err.message), "error");
      } finally {
        authBtn.disabled = false;
      }
    };

    function translateError(msg) {
      if (/Invalid login credentials/i.test(msg)) return "E-posta veya şifre hatalı.";
      if (/User already registered/i.test(msg)) return "Bu e-posta zaten kayıtlı. Giriş yapmayı dene.";
      if (/Password should be/i.test(msg)) return "Şifre en az 6 karakter olmalı.";
      return msg;
    }

    logoutBtn.onclick = async () => { await supabase.auth.signOut(); };

    // Oturum durumu değişince görünümü güncelle
    supabase.auth.onAuthStateChange((_event, session) => {
      if (session) {
        authView.classList.add("hidden");
        appView.classList.remove("hidden");
        userEmail.textContent = session.user.email;
        loadTodos();
      } else {
        appView.classList.add("hidden");
        authView.classList.remove("hidden");
        authForm.reset();
        todoList.innerHTML = "";
      }
    });

    // Todo işlemleri
    async function loadTodos() {
      const { data, error } = await supabase
        .from("todos")
        .select("*")
        .order("created_at", { ascending: true });
      if (error) { console.error(error); return; }
      renderTodos(data || []);
    }

    function renderTodos(todos) {
      todoList.innerHTML = "";
      emptyState.classList.toggle("hidden", todos.length > 0);
      for (const t of todos) {
        const li = document.createElement("li");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = t.is_complete;
        cb.onchange = () => toggleTodo(t.id, cb.checked);

        const span = document.createElement("span");
        span.className = "task" + (t.is_complete ? " done" : "");
        span.textContent = t.task;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.title = "Sil";
        del.onclick = () => deleteTodo(t.id);

        li.append(cb, span, del);
        todoList.appendChild(li);
      }
    }

    addForm.onsubmit = async (e) => {
      e.preventDefault();
      const task = newTask.value.trim();
      if (!task) return;
      const { data: { user } } = await supabase.auth.getUser();
      const { error } = await supabase.from("todos").insert({ task, user_id: user.id });
      if (error) { console.error(error); return; }
      newTask.value = "";
      loadTodos();
    };

    async function toggleTodo(id, isComplete) {
      const { error } = await supabase.from("todos").update({ is_complete: isComplete }).eq("id", id);
      if (error) console.error(error);
      else loadTodos();
    }

    async function deleteTodo(id) {
      const { error } = await supabase.from("todos").delete().eq("id", id);
      if (error) console.error(error);
      else loadTodos();
    }
  </script>
</body>
</html>
